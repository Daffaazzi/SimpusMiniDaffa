<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>SewaKamera Batu | Tambah Member</title>

  <link rel="stylesheet" href="../assets/css/style.css">
</head>

<body>

<header>
  <h1>SewaKamera Batu</h1>

  <div class="header-tools">
    <button
      type="button"
      class="btn-menu"
      aria-label="Buka menu"
      aria-expanded="false">
      ☰
    </button>

    <button type="button" class="btn-logout">
      Logout
    </button>
  </div>

  <nav class="nav">
    <ul>
      <li><a href="../index.html">Beranda</a></li>
      <li><a href="../buku/list.html">Daftar Kamera & Lensa</a></li>
      <li><a href="../buku/tambah.html">Tambah Unit</a></li>
      <li><a href="list.html">Daftar Member</a></li>
      <li><a href="tambah.html">Tambah Member</a></li>
    </ul>
  </nav>
</header>

<main>

  <section>

    <h2>Tambah Member Penyewaan</h2>

    <form id="form-tambah-anggota">

      <p>
        <label for="no_anggota">
          Nomor Member
        </label>

        <input
          type="text"
          id="no_anggota"
          name="no_anggota"
          placeholder="Contoh: M005"
          required>
      </p>

      <p>
        <label for="nama">
          Nama Lengkap
        </label>

        <input
          type="text"
          id="nama"
          name="nama"
          placeholder="Masukkan nama lengkap"
          required>
      </p>

      <p>
        <label for="alamat">
          Alamat
        </label>

        <input
          type="text"
          id="alamat"
          name="alamat"
          placeholder="Masukkan alamat"
          required>
      </p>

      <p>
        <label for="no_hp">
          Nomor HP
        </label>

        <input
          type="tel"
          id="no_hp"
          name="no_hp"
          placeholder="Contoh: 08123456789"
          required>
      </p>

      <p>
        <button type="submit">
          Simpan Member
        </button>
      </p>

    </form>

  </section>

</main>

<footer>
  &copy; 2026 SewaKamera Batu — Penyewaan Kamera & Lensa
</footer>

<script src="../assets/js/app.js"></script>

</body>
</html>
