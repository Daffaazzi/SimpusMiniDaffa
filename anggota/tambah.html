<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">

  <title>Peminjaman Buku | Tambah Anggota</title>

  <link rel="stylesheet" href="../assets/css/style.css">
</head>

<body>

<header>
  <h1>SIMPUS-Mini</h1>

  <button
    type="button"
    class="btn-menu"
    aria-label="Buka menu"
    aria-expanded="false">
    ☰
  </button>

  <nav class="nav">
    <ul>
      <li><a href="../index.html">Beranda</a></li>
      <li><a href="../buku/list.html">Daftar Buku</a></li>
      <li><a href="../buku/tambah.html">Tambah Buku</a></li>
      <li><a href="list.html">Daftar Anggota</a></li>
      <li><a href="tambah.html">Tambah Anggota</a></li>
    </ul>
  </nav>
</header>

<main>

  <section>

    <h2>Tambah Anggota</h2>

    <form id="form-tambah-anggota">

      <p>
        <label for="no_anggota">
          Nomor Anggota
        </label>

        <input
          type="text"
          id="no_anggota"
          name="no_anggota"
          placeholder="Contoh: A005"
          required>
      </p>

      <p>
        <label for="nama">
          Nama Lengkap
        </label>

        <input
          type="text"
          id="nama"
          name="nama"
          placeholder="Masukkan nama lengkap"
          required>
      </p>

      <p>
        <label for="alamat">
          Alamat
        </label>

        <input
          type="text"
          id="alamat"
          name="alamat"
          placeholder="Masukkan alamat"
          required>
      </p>

      <p>
        <label for="no_hp">
          Nomor HP
        </label>

        <input
          type="tel"
          id="no_hp"
          name="no_hp"
          placeholder="Contoh: 08123456789"
          required>
      </p>

      <p>
        <button type="submit">
          Simpan Anggota
        </button>
      </p>

    </form>

  </section>

</main>
