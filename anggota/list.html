<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Peminjaman Buku | Daftar Anggota</title>

  <link rel="stylesheet" href="../assets/css/style.css">
</head>

<body>

<header>
  <h1>SIMPUS-Mini</h1>

  <button
    type="button"
    class="btn-menu"
    aria-label="Buka menu"
    aria-expanded="false">
    ☰
  </button>

  <nav class="nav">
    <ul>
      <li><a href="../index.html">Beranda</a></li>
      <li><a href="../buku/list.html">Daftar Buku</a></li>
      <li><a href="../buku/tambah.html">Tambah Buku</a></li>
      <li><a href="list.html">Daftar Anggota</a></li>
      <li><a href="tambah.html">Tambah Anggota</a></li>
    </ul>
  </nav>
</header>

<main>

  <section>

    <h2>Daftar Anggota</h2>

    <div class="search-box">

      <label for="search-anggota">
        Cari Anggota
      </label>

      <input
        type="text"
        id="search-anggota"
        placeholder="Ketik nama, nomor anggota, atau alamat...">

    </div>

    <div id="loading-indicator">
      Memuat data, harap tunggu...
    </div>

    <div class="table-responsive">

      <table id="table-anggota">

        <thead>
          <tr>
            <th>No</th>
            <th>No. Anggota</th>
            <th>Nama</th>
            <th>Alamat</th>
            <th>No. HP</th>
            <th>Aksi</th>
          </tr>
        </thead>

        <tbody></tbody>

      </table>

    </div>

  </section>

</main>

<footer>
  &copy; 2026 SIMPUS-Mini — Pemrograman Web
</footer>

<script src="../assets/js/anggota.js"></script>

</body>
