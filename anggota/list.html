<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>SewaKamera Batu | Daftar Member</title>

  <link rel="stylesheet" href="../assets/css/style.css">
</head>

<body>

<header>
  <h1>SewaKamera Batu</h1>

  <div class="header-tools">
    <button
      type="button"
      class="btn-menu"
      aria-label="Buka menu"
      aria-expanded="false">
      ☰
    </button>

    <button type="button" class="btn-logout">
      Logout
    </button>
  </div>

  <nav class="nav">
    <ul>
      <li><a href="../index.html">Beranda</a></li>
      <li><a href="../buku/list.html">Daftar Kamera & Lensa</a></li>
      <li><a href="../buku/tambah.html">Tambah Unit</a></li>
      <li><a href="list.html">Daftar Member</a></li>
      <li><a href="tambah.html">Tambah Member</a></li>
    </ul>
  </nav>
</header>

<main>

  <section>

    <h2>Daftar Member Penyewaan</h2>

    <div class="search-box">

      <label for="search-anggota">
        Cari Member
      </label>

      <input
        type="text"
        id="search-anggota"
        placeholder="Ketik nama, kode member, atau alamat...">

    </div>

    <div id="loading-indicator">
      Memuat data, harap tunggu...
    </div>

    <div class="table-responsive">

      <table id="table-anggota">

        <thead>
          <tr>
            <th>No</th>
            <th>No. Member</th>
            <th>Nama Member</th>
            <th>Email</th>
            <th>No. HP</th>
            <th>Alamat</th>
            <th>Aksi</th>
          </tr>
        </thead>

        <tbody></tbody>

      </table>

    </div>

  </section>

</main>

<footer>
  &copy; 2026 SewaKamera Batu — Penyewaan Kamera & Lensa
</footer>

<script src="../assets/js/anggota.js"></script>

</body>
</html>
