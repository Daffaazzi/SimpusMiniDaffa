<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tambah Anggota - BatuCam Rental</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootswatch/5.3.8/brite/bootstrap.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="assets/css/style.css">
<link rel="icon" href="assets/img/logo.svg" type="image/svg+xml">
</head>
<body>

<div id="navbar-placeholder"></div>

<div class="container py-5" style="max-width:680px;">
  <h2 class="section-title mb-1"><i class="fa-solid fa-user-plus text-brand-accent me-2"></i>Tambah Anggota</h2>
  <p class="section-subtitle mb-4">Data pelanggan tetap BatuCam Rental, disimpan ke <code>localStorage</code>.</p>

  <div id="errorArea"></div>

  <div class="card shadow-sm border-0">
    <div class="card-body p-4">
      <form id="formAnggota" class="needs-validation" novalidate>
        <div class="row g-3">
          <div class="col-md-6">
            <label class="form-label fw-semibold small">Nama Lengkap</label>
            <input type="text" name="nama" class="form-control" required minlength="3">
            <div class="invalid-feedback">Nama minimal 3 karakter.</div>
          </div>
          <div class="col-md-6">
            <label class="form-label fw-semibold small">No. KTP / Identitas</label>
            <input type="text" name="no_identitas" class="form-control" required pattern="[0-9]{10,16}" placeholder="16 digit NIK">
            <div class="invalid-feedback">Nomor identitas 10-16 digit angka.</div>
          </div>
          <div class="col-md-6">
            <label class="form-label fw-semibold small">No. WhatsApp</label>
            <input type="text" name="whatsapp" class="form-control" required pattern="[0-9+\s-]{8,15}">
            <div class="invalid-feedback">Nomor WhatsApp tidak valid.</div>
          </div>
          <div class="col-md-6">
            <label class="form-label fw-semibold small">Email</label>
            <input type="email" name="email" class="form-control" required>
            <div class="invalid-feedback">Email tidak valid.</div>
          </div>
          <div class="col-12">
            <label class="form-label fw-semibold small">Alamat</label>
            <textarea name="alamat" class="form-control" rows="2" required minlength="8"></textarea>
            <div class="invalid-feedback">Alamat minimal 8 karakter.</div>
          </div>
        </div>

        <div class="d-flex gap-2 mt-4">
          <button type="submit" class="btn btn-brand-accent px-4"><i class="fa-solid fa-check me-1"></i>Simpan Anggota</button>
          <a href="anggota-list.html" class="btn btn-outline-dark px-4">Batal</a>
        </div>
      </form>
    </div>
  </div>
</div>

<div id="footer-placeholder"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/auth.js"></script>
<script src="assets/js/common.js"></script>
<script src="assets/js/anggota.js"></script>
<script src="assets/js/app.js"></script>
<script>
  requireLogin();
  renderNavbar('anggota-tambah.html');
  renderFooter();

  document.getElementById('formAnggota').addEventListener('submit', function (e) {
    e.preventDefault();
    const form = e.target;
    if (!form.checkValidity()) {
      form.classList.add('was-validated');
      return;
    }

    const fd = new FormData(form);
    const data = Object.fromEntries(fd.entries());
    const hasil = tambahAnggota(data);

    const errorArea = document.getElementById('errorArea');
    if (hasil.ok) {
      setFlash('Anggota ' + data.nama + ' berhasil ditambahkan.');
      window.location.href = 'anggota-list.html?baru=1';
    } else {
      errorArea.innerHTML = `
        <div class="alert alert-danger">
          <strong>Periksa kembali isian berikut:</strong>
          <ul class="mb-0 mt-1">
            ${hasil.errors.map(e => `<li>${e}</li>`).join('')}
          </ul>
        </div>`;
    }
  });
</script>
</body>
</html>
