<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Katalog Merk - BatuCam Rental</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootswatch/5.3.8/brite/bootstrap.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="assets/css/style.css">
<link rel="icon" href="assets/img/logo.svg" type="image/svg+xml">
</head>
<body>

<div id="navbar-placeholder"></div>

<section class="hero-section" style="min-height:34vh;">
  <div class="container">
    <span class="badge hero-badge text-white px-3 py-2 rounded-pill mb-3">
      <i class="fa-solid fa-camera me-1"></i> Katalog
    </span>
    <h1 class="mb-2" style="font-size:clamp(1.8rem,4vw,2.6rem);">Katalog Merk Kamera &amp; Lensa</h1>
    <p class="lead mb-0">14 merk pilihan, tersedia untuk disewa harian di Kota Batu.</p>
  </div>
</section>

<div class="container py-5">
  <div class="d-flex flex-wrap gap-2 mb-4" id="filterKategori">
    <button class="btn btn-sm btn-brand-accent" data-kategori="Semua">Semua</button>
    <button class="btn btn-sm btn-outline-dark" data-kategori="Kamera">Body Kamera</button>
    <button class="btn btn-sm btn-outline-dark" data-kategori="Lensa">Lensa</button>
  </div>

  <div class="row g-4" id="daftarProduk"></div>
</div>

<div id="footer-placeholder"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/data-merk.js"></script>
<script src="assets/js/auth.js"></script>
<script src="assets/js/common.js"></script>
<script src="assets/js/app.js"></script>
<script>
  renderNavbar('produk.html');
  renderFooter();

  function renderProduk(filter) {
    const container = document.getElementById('daftarProduk');
    const data = filter === 'Semua' ? DAFTAR_MERK : DAFTAR_MERK.filter(m => m.kategori === filter);

    container.innerHTML = data.map(function (m) {
      const tujuanSewa = isLoggedIn()
        ? 'buku-tambah.html?merk=' + encodeURIComponent(m.slug)
        : 'login.html';
      return `
        <div class="col-6 col-md-4 col-lg-3">
          <div class="card brand-card">
            <img src="assets/img/brands/${m.slug}.svg" alt="${m.nama}">
            <div class="card-body d-flex flex-column">
              <span class="badge bg-secondary-subtle text-secondary-emphasis mb-2 align-self-start">${m.kategori}</span>
              <h6 class="fw-bold mb-1">${m.nama}</h6>
              <p class="small text-muted mb-2 flex-grow-1">${m.tipe}</p>
              <p class="fw-bold text-brand-accent mb-3">${formatRupiah(m.harga)} <span class="fw-normal text-muted small">/hari</span></p>
              <a href="${tujuanSewa}" class="btn btn-brand-accent btn-sm w-100">
                <i class="fa-solid fa-cart-plus me-1"></i> Sewa Sekarang
              </a>
            </div>
          </div>
        </div>`;
    }).join('');
  }

  renderProduk('Semua');

  document.getElementById('filterKategori').addEventListener('click', function (e) {
    const btn = e.target.closest('button[data-kategori]');
    if (!btn) return;

    this.querySelectorAll('button').forEach(b => b.classList.remove('btn-brand-accent') || b.classList.add('btn-outline-dark'));
    btn.classList.remove('btn-outline-dark');
    btn.classList.add('btn-brand-accent');

    renderProduk(btn.dataset.kategori);
  });
</script>
</body>
</html>
