<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Peminjaman Buku | Login</title>

  <link rel="stylesheet" href="assets/css/style.css">

  <style>
    .login-container {
      max-width: 420px;
      margin: 60px auto;
    }

    .login-container h2 {
      text-align: center;
      margin-bottom: 25px;
    }

    .btn-submit {
      width: 100%;
    }
  </style>
</head>

<body>

<header>
  <h1>SIMPUS-Mini</h1>
</header>

<main>
    
  <section class="login-container">

    <h2>Login Sistem</h2>

    <form id="loginForm">

      <p>
        <label for="username">
          Username
        </label>

        <input
          type="text"
          id="username"
          name="username"
          placeholder="Masukkan username"
          required>
      </p>

      <p>
        <label for="password">
          Password
        </label>

        <input
          type="password"
          id="password"
          name="password"
          placeholder="Masukkan password"
          required>
      </p>

      <p>
        <button
          type="submit"
          class="btn-submit">
          Masuk
        </button>
      </p>

    </form>

  </section>

</main>
    
<footer>
  &copy; 2026 Peminjaman Buku — Pemrograman Web
</footer>

<script>
  document
    .getElementById("loginForm")
    .addEventListener("submit", function(event) {

      event.preventDefault();

      localStorage.setItem("isLoggedIn", "true");

      alert("Login berhasil!");

      window.location.href = "index.html";
    });
</script>

</body>
</html>
