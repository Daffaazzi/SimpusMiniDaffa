<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>SewaKamera Batu | Login</title>

  <link rel="stylesheet" href="assets/css/style.css">
</head>

<body>

<header>
  <h1>SewaKamera Batu</h1>
</header>

<main>
    
  <section class="login-container">

    <h2>Login Dashboard Penyewaan</h2>

    <form id="loginForm">

      <p>
        <label for="username">
          Username
        </label>

        <input
          type="text"
          id="username"
          name="username"
          placeholder="Masukkan username"
          required>
      </p>

      <p>
        <label for="password">
          Password
        </label>

        <input
          type="password"
          id="password"
          name="password"
          placeholder="Masukkan password"
          required>
      </p>

      <p>
        <button
          type="submit"
          class="btn-submit">
          Masuk
        </button>
      </p>

      <p class="meta-note">
        Gunakan akun apa saja untuk demo lokal.
      </p>

    </form>

  </section>

</main>
    
<footer>
  &copy; 2026 SewaKamera Batu — Penyewaan Kamera & Lensa
</footer>

<script>
  if (localStorage.getItem("isLoggedIn") === "true") {
    window.location.href = "index.html";
  }

  document
    .getElementById("loginForm")
    .addEventListener("submit", function(event) {

      event.preventDefault();

      localStorage.setItem("isLoggedIn", "true");

      alert("Login berhasil!");

      window.location.href = "index.html";
    });
</script>

</body>
</html>
