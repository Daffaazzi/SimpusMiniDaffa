<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Data Booking - BatuCam Rental</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootswatch/5.3.8/brite/bootstrap.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="assets/css/style.css">
<link rel="icon" href="assets/img/logo.svg" type="image/svg+xml">
</head>
<body>

<div id="navbar-placeholder"></div>

<div class="container py-5">
  <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-4">
    <div>
      <h2 class="section-title mb-1"><i class="fa-solid fa-calendar-days text-brand-accent me-2"></i>Data Booking Sewa</h2>
      <p class="section-subtitle mb-0">Data dirender langsung dari <code>localStorage</code> lewat JavaScript.</p>
    </div>
    <a href="buku-tambah.html" class="btn btn-brand-accent"><i class="fa-solid fa-plus me-1"></i> Tambah Booking</a>
  </div>

  <div id="flashArea"></div>

  <div class="card border-0 shadow-sm">
    <div class="table-responsive">
      <table class="table table-hover align-middle mb-0">
        <thead>
          <tr>
            <th>#</th>
            <th>Penyewa</th>
            <th>WhatsApp</th>
            <th>Merk</th>
            <th>Unit</th>
            <th>Periode Sewa</th>
            <th>Total</th>
            <th>Status</th>
            <th class="text-end">Aksi</th>
          </tr>
        </thead>
        <tbody id="tbodyBooking"></tbody>
      </table>
    </div>
  </div>
</div>

<div id="footer-placeholder"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/data-merk.js"></script>
<script src="assets/js/auth.js"></script>
<script src="assets/js/common.js"></script>
<script src="assets/js/booking.js"></script>
<script src="assets/js/app.js"></script>
<script>
  requireLogin();
  renderNavbar('buku-list.html');
  renderFooter();

  const isBaru = new URLSearchParams(window.location.search).has('baru');

  function formatTanggal(str) {
    return new Date(str + 'T00:00:00').toLocaleDateString('id-ID', { day: '2-digit', month: 'short', year: 'numeric' });
  }

  function tampilkanBooking() {
    const tbody = document.getElementById('tbodyBooking');
    const list = getBookingList().slice().reverse();

    if (list.length === 0) {
      tbody.innerHTML = `
        <tr>
          <td colspan="9" class="text-center text-muted py-5">
            <i class="fa-solid fa-inbox fs-3 d-block mb-2"></i>
            Belum ada data booking. Klik "Tambah Booking" untuk mulai.
          </td>
        </tr>`;
      return;
    }

    tbody.innerHTML = list.map(function (b, i) {
      return `
        <tr ${(isBaru && i === 0) ? 'class="flash"' : ''}>
          <td>${i + 1}</td>
          <td class="fw-semibold">${b.nama_penyewa}</td>
          <td>${b.whatsapp}</td>
          <td>${b.merk_nama}</td>
          <td>${b.jumlah_unit} unit</td>
          <td class="small">${formatTanggal(b.tgl_mulai)} &ndash; ${formatTanggal(b.tgl_selesai)}
            <span class="text-muted">(${b.lama_hari} hari)</span></td>
          <td class="fw-bold text-brand-accent">${formatRupiah(b.total_harga)}</td>
          <td><span class="badge badge-status-baru text-dark">${b.status}</span></td>
          <td class="text-end">
            <button class="btn btn-sm btn-outline-danger btn-hapus-konfirmasi" data-id="${b.id}">
              <i class="fa-solid fa-trash"></i>
            </button>
          </td>
        </tr>`;
    }).join('');
  }

  tampilkanBooking();

  document.getElementById('tbodyBooking').addEventListener('click', function (e) {
    const btn = e.target.closest('.btn-hapus-konfirmasi');
    if (!btn) return;
    // Konfirmasi ditangani di app.js; kalau tidak dibatalkan, event lanjut ke sini
    hapusBooking(btn.dataset.id);
    tampilkanBooking();
  });
</script>
</body>
</html>
