<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>SewaKamera Batu | Daftar Kamera & Lensa</title>

  <link rel="stylesheet" href="../assets/css/style.css">
</head>

<body>

<header>
  <h1>SewaKamera Batu</h1>

  <div class="header-tools">
    <button
      type="button"
      class="btn-menu"
      aria-label="Buka menu"
      aria-expanded="false">
      ☰
    </button>

    <button type="button" class="btn-logout">
      Logout
    </button>
  </div>

  <nav class="nav">
    <ul>
      <li><a href="../index.html">Beranda</a></li>
      <li><a href="list.html">Daftar Kamera & Lensa</a></li>

      <li><a href="../anggota/tambah.html">Tambah Member</a></li>
    </ul>
  </nav>
</header>

<main>

  <section>

    <h2>Daftar Kamera & Lensa</h2>

    <div class="search-box">
      <label for="search-buku">Cari Unit</label>

      <input
        type="text"
        id="search-buku"
        placeholder="Ketik merek, tipe unit, atau kategori...">
    </div>

    <div id="loading-indicator">
      Memuat data, harap tunggu...
    </div>

    <div class="table-responsive">

      <table id="table-buku">

        <thead>
          <tr>
            <th>No</th>
            <th>Merek</th>
            <th>Tipe Unit</th>
            <th>Lokasi</th>
            <th>Tahun</th>
            <th>Kategori</th>
            <th>Stok</th>
            <th>Aksi</th>
          </tr>
        </thead>

        <tbody></tbody>

      </table>

    </div>

  </section>

</main>

<footer>
  &copy; 2026 SewaKamera Batu — Penyewaan Kamera & Lensa
