<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SIMPUS-Mini | Daftar Buku</title>
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
  <header>
    <h1>SIMPUS-Mini</h1>
    <button type="button" class="btn-menu" aria-label="Toggle navigasi" aria-expanded="false">&#9776;</button>
    <nav class="nav">
      <ul>
        <li><a href="../index.html">Beranda</a></li>
        <li><a href="list.html">Daftar Buku</a></li>
        <li><a href="tambah.html">Tambah Buku</a></li>
        <li><a href="../anggota/list.html">Daftar Anggota</a></li>
        <li><a href="../anggota/tambah.html">Tambah Anggota</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section>
      <h2>Daftar Buku</h2>
      <div class="search-box">
        <label for="search-buku">Cari Buku</label>
        <input type="text" id="search-buku" placeholder="Ketik judul, pengarang, atau kategori...">
      </div>

      <!-- TARUH DI SINI: Di atas tabel -->
      <div id="loading-indicator" class="loading-spinner">
        Memuat data, harap tunggu...
      </div>
      
      <div class="table-responsive">
        <table id="table-buku">
          <thead>
            <tr>
              <th>No</th>
              <th>Judul</th>
              <th>Pengarang</th>
              <th>Penerbit</th>
              <th>Tahun</th>
              <th>Kategori</th>
              <th>Stok</th>
              <th>Aksi</th>
            </tr>
          </thead>
          <!-- tbody dikosongkan, diisi secara dinamis oleh buku.js -->
          <tbody></tbody>
        </table>
      </div>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 SIMPUS-Mini &mdash; Jobsheet 5</p>
  </footer>

  <script src="../assets/js/buku.js"></script>
  <script src="../assets/js/app.js"></script>
</body>
</html>
