<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Peminjaman Buku | Tambah Buku</title>

  <link rel="stylesheet" href="../assets/css/style.css">
</head>

<body>

<header>
  <h1>Peminjaman Buku</h1>

  <button
    type="button"
    class="btn-menu"
    aria-label="Buka menu"
    aria-expanded="false">
    ☰
  </button>

  <nav class="nav">
    <ul>
      <li><a href="../index.html">Beranda</a></li>
      <li><a href="list.html">Daftar Buku</a></li>
      <li><a href="tambah.html">Tambah Buku</a></li>
      <li><a href="../anggota/list.html">Daftar Anggota</a></li>
      <li><a href="../anggota/tambah.html">Tambah Anggota</a></li>
    </ul>
  </nav>
</header>

<main>

  <section>

    <h2>Tambah Buku</h2>

    <form id="form-tambah-buku">

      <p>
        <label for="judul">Judul Buku</label>
        <input
          type="text"
          id="judul"
          name="judul"
          placeholder="Masukkan judul buku"
          required>
      </p>

      <p>
        <label for="pengarang">Pengarang</label>
        <input
          type="text"
          id="pengarang"
          name="pengarang"
          placeholder="Masukkan nama pengarang"
          required>
      </p>

      <p>
        <label for="penerbit">Penerbit</label>
        <input
          type="text"
          id="penerbit"
          name="penerbit"
          placeholder="Masukkan penerbit"
          required>
      </p>

      <p>
        <label for="tahun">Tahun Terbit</label>
        <input
          type="number"
          id="tahun"
          name="tahun"
          placeholder="Contoh: 2024"
          required>
      </p>

      <p>
        <label for="isbn">ISBN</label>
        <input
          type="text"
          id="isbn"
          name="isbn"
          placeholder="Masukkan ISBN">
      </p>

      <p>
        <label for="stok">Stok</label>
        <input
          type="number"
          id="stok"
          name="stok"
          min="0"
          placeholder="Masukkan jumlah stok"
          required>
      </p>

      <p>
        <label for="kategori">Kategori</label>

        <select id="kategori" name="kategori">

          <option value="Novel">Novel</option>
          <option value="Fiksi Sejarah">Fiksi Sejarah</option>
          <option value="Self Improvement">Self Improvement</option>
          <option value="Puisi & Sastra">Puisi & Sastra</option>
          <option value="Referensi">Referensi</option>

        </select>
      </p>

      <p>
        <button type="submit">
          Simpan Buku
        </button>
      </p>

    </form>

  </section>

</main>

<footer>
  &copy; 2026 SIMPUS-Mini — Pemrograman Web
</footer>

<script src="../assets/js/app.js"></script>

</body>
</html>
