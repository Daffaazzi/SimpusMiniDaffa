<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>SewaKamera Batu | Tambah Unit</title>

  <link rel="stylesheet" href="../assets/css/style.css">
</head>

<body>

<header>
  <h1>SewaKamera Batu</h1>

  <div class="header-tools">
    <button
      type="button"
      class="btn-menu"
      aria-label="Buka menu"
      aria-expanded="false">
      ☰
    </button>

    <button type="button" class="btn-logout">
      Logout
    </button>
  </div>

  <nav class="nav">
    <ul>
      <li><a href="../index.html">Beranda</a></li>
      <li><a href="list.html">Daftar Kamera & Lensa</a></li>
      <li><a href="tambah.html">Tambah Unit</a></li>
      <li><a href="../anggota/list.html">Daftar Member</a></li>
      <li><a href="../anggota/tambah.html">Tambah Member</a></li>
    </ul>
  </nav>
</header>

<main>

  <section>

    <h2>Tambah Unit Kamera / Lensa</h2>

    <form id="form-tambah-buku">

      <p>
        <label for="judul">Merek</label>
        <input
          type="text"
          id="judul"
          name="judul"
          placeholder="Contoh: Canon"
          required>
      </p>

      <p>
        <label for="pengarang">Tipe Unit</label>
        <input
          type="text"
          id="pengarang"
          name="pengarang"
          placeholder="Contoh: Mirrorless Full Frame"
          required>
      </p>

      <p>
        <label for="penerbit">Lokasi</label>
        <input
          type="text"
          id="penerbit"
          name="penerbit"
          placeholder="Contoh: Kota Batu"
          required>
      </p>

      <p>
        <label for="tahun">Tahun Produksi</label>
        <input
          type="number"
          id="tahun"
          name="tahun"
          placeholder="Contoh: 2024"
          required>
      </p>

      <p>
        <label for="isbn">Kode Unit</label>
        <input
          type="text"
          id="isbn"
          name="isbn"
          placeholder="Contoh: CAM-015">
      </p>

      <p>
        <label for="stok">Jumlah Unit</label>
        <input
          type="number"
          id="stok"
          name="stok"
          min="0"
            placeholder="Masukkan jumlah unit"
          required>
      </p>

      <p>
        <label for="kategori">Kategori</label>

        <select id="kategori" name="kategori">

          <option value="Kamera DSLR">Kamera DSLR</option>
          <option value="Kamera Mirrorless">Kamera Mirrorless</option>
          <option value="Lensa">Lensa</option>
          <option value="Action Cam">Action Cam</option>
          <option value="Drone">Drone</option>
          <option value="Kamera Film">Kamera Film</option>

        </select>
      </p>

      <p>
        <button type="submit">
          Simpan Unit
        </button>
      </p>

    </form>

  </section>

</main>

<footer>
  &copy; 2026 SewaKamera Batu — Penyewaan Kamera & Lensa
</footer>

<script src="../assets/js/app.js"></script>

</body>
</html>
